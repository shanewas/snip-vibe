[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snip-vibe"
version = "0.1.0"
description = "✂️ SnipVibe (sv) — Dead-simple local snippet vault. Your code, zero friction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shanewas Ahmed", email = "shanewasahmed@gmail.com"}]
keywords = ["snippets", "vault", "clipboard", "cli", "productivity", "rich", "vibe", "code"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Utilities"]
dependencies = ["typer[all]>=0.15.1", "rich>=13.9.4", "pyperclip>=1.9.0"]

[project.scripts]
sv = "snip_vibe.cli:app"

[project.urls]
Homepage = "https://github.com/shanewas/snip-vibe"
Repository = "https://github.com/shanewas/snip-vibe"
Issues = "https://github.com/shanewas/snip-vibe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snip_vibe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"